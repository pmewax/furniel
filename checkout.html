<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
<div id="header"></div>
<section class="page-hero" style="padding:60px 0;background:linear-gradient(180deg,#fff,#fbfdff)">
      <div class="container">
        <h1 class="hero-title" style="font-size:56px;margin:0 0 10px;color:var(--primary)">Оформление заказа</h1>
        <p class="hero-subtitle" style="font-size:18px;color:#6b7280;margin:0">Заполните контактные данные</p>
      </div>
    </section>

<main class='container' style='padding:30px 0'>
    <section class="checkout-page">
        <div class="container">
            <div class="checkout-content">
                <div class="checkout-form-section">
                    <form class="checkout-form" id="checkoutForm">
                        <!-- Упрощенная форма: только контактные данные -->
                        <div class="checkout-step active" id="step1">
                            <h2>Контактные данные</h2>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="firstName">Имя *</label>
                                    <input type="text" id="firstName" name="firstName" required>
                                </div>
                                <div class="form-group">
                                    <label for="lastName">Фамилия *</label>
                                    <input type="text" id="lastName" name="lastName" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="phone">Телефон *</label>
                                <input type="tel" id="phone" name="phone" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required>
                            </div>

                            <div class="form-group">
                                <label for="city">Город *</label>
                                <input type="text" id="city" name="city" required>
                            </div>

                            <div class="form-group">
                                <label for="address">Адрес доставки *</label>
                                <textarea id="address" name="address" rows="3" required placeholder="Улица, дом, квартира"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="comment">Комментарий к заказу</label>
                                <textarea id="comment" name="comment" rows="3" placeholder="Дополнительные пожелания по доставке или заказу"></textarea>
                            </div>
                            
                            <div class="privacy-agreement">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="privacyAgreement" required>
                                    <span>Я соглашаюсь с <a href="privacy-policy.html" target="_blank">Политикой конфиденциальности</a> и <a href="offer.html" target="_blank">Публичной офертой</a></span>
                                </label>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn-primary" id="submitOrder">Отправить заявку менеджеру</button>
                            </div>

                            <div class="manager-note">
                                <p>После отправки заявки наш менеджер свяжется с вами для уточнения деталей заказа, способа оплаты и доставки.</p>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="order-summary-sidebar">
                    <div class="summary-card">
                        <h3>Ваш заказ</h3>
                        <div class="order-items" id="orderItems">
                            <!-- Товары будут загружены через JS -->
                        </div>
                        <div class="order-totals">
                            <div class="total-row">
                                <span>Товары</span>
                                <span id="subtotal">0 ₽</span>
                            </div>
                            <div class="total-row grand-total">
                                <span>Итого</span>
                                <span id="grandTotal">0 ₽</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="support-card">
                        <h4>Нужна помощь?</h4>
                        <p>📞 +7 993 959-75-61</p>
                        <p>✉️ info@furniel.com</p>
                        <div class="support-links">
                            <a href="https://t.me/busnessoa" target="_blank">Telegram</a>
                            <a href="https://api.whatsapp.com/send/?phone=%2B79323297561" target="_blank">WhatsApp</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="footer"></div>
<script src="assets/js/include.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/checkout.js"></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
